<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b0c2e">
<meta name="apple-mobile-web-app-title" content="音ゲー">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音ゲー</title>
<style>
:root{--bg:#07071a;--card:#14143a;--bd:#34346e;--fg:#eef0ff;--mut:#9aa0d0;--ac:#ff4f8b;--ac2:#6a5cff;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#05050f;color:var(--fg);font:15px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;position:fixed;inset:0;width:100%;height:100%}
canvas{position:fixed;left:0;top:0;background:#0b0b12;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;display:block}
button{font:inherit;color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;background:linear-gradient(135deg,var(--ac2),#4a3df0)}
button:active{transform:scale(.97)}
#bar{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:8px}
#bar button{padding:8px 14px;font-size:14px;border-radius:999px;background:rgba(20,20,58,.78);border:1px solid rgba(255,255,255,.25)}
#stop:disabled{display:none}
#menu{position:fixed;inset:0;z-index:10;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(1200px 600px at 50% -10%,rgba(106,92,255,.35),transparent),rgba(5,5,20,.94);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));transition:background .2s}
#menu.hide{display:none}
#menu.peek{background:rgba(5,5,20,0)}
#menu.peek .wrapm>*{opacity:.12}
#menu.peek .wrapm>.keep{opacity:1;background:rgba(20,20,58,.6)}
.wrapm{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:30px}
.wrapm>*{transition:opacity .2s}
.hero{text-align:center;padding:6px 0 0}
.logo{font-size:30px;font-weight:800;letter-spacing:.12em;background:linear-gradient(90deg,#ff6a9a,#8a7bff,#4fc3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px}
.actions{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media(max-width:520px){.actions{grid-template-columns:1fr}}
.big{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 12px;font-size:20px;font-weight:700;border-radius:18px;text-align:left}
.big .ic{font-size:28px}
.big small{display:block;font-size:11px;font-weight:400;opacity:.9}
.go{background:linear-gradient(135deg,#ff4f8b,#ff8a5c);box-shadow:0 6px 24px rgba(255,79,139,.4)}
.cal{background:linear-gradient(135deg,#6a5cff,#3f8cff);box-shadow:0 6px 24px rgba(106,92,255,.4);font-size:16px}
.mini{display:flex;gap:10px;justify-content:center}
.mini button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:8px 16px;font-size:14px}
.card{background:linear-gradient(180deg,rgba(28,28,74,.85),rgba(18,18,50,.85));border:1px solid var(--bd);border-radius:18px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:15px;letter-spacing:.05em;color:#cfd4ff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.row>span{color:var(--mut);font-size:14px}
.sl{display:block;padding:6px 0}
.sl .top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.sl b{color:#fff}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=number]{width:90px;padding:8px;border-radius:10px;border:1px solid var(--bd);background:#0d0d2a;color:#fff;font-size:16px;text-align:right;user-select:text;-webkit-user-select:text}
select{padding:8px;border-radius:10px;border:1px solid var(--bd);background:#0d0d2a;color:#fff;font-size:15px}
.seg{display:flex;background:#0d0d2a;border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}
.seg button{background:transparent;padding:7px 12px;font-size:14px;border-radius:9px;color:var(--mut)}
.seg button.on{background:linear-gradient(135deg,var(--ac),#ff8a5c);color:#fff;box-shadow:0 2px 10px rgba(255,79,139,.35)}
.sw{position:relative;width:52px;height:30px;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#2a2a5a;border-radius:30px;transition:.2s}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ac)}
.sw input:checked+i:before{transform:translateX(22px)}
details{background:rgba(18,18,50,.7);border:1px solid var(--bd);border-radius:18px;padding:12px 16px}
summary{cursor:pointer;color:#cfd4ff}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;margin-top:10px}
.dgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.hint{color:var(--mut);font-size:12px;padding-top:4px}
#st{color:#fff;text-align:center;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px}
#st:empty{display:none}
#dbg{text-align:center;font-size:11px;opacity:.5;white-space:pre-line}
#pause{position:fixed;inset:0;z-index:8;background:rgba(5,5,20,.55);display:flex;align-items:center;justify-content:center}
#pause.hide{display:none}
.pbox{background:linear-gradient(180deg,#1e1e52,#14143a);border:1px solid var(--bd);border-radius:22px;padding:24px 28px;text-align:center;min-width:290px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.ptitle{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:.1em}
.pbox button{display:block;width:100%;margin:12px 0 0;font-size:18px;padding:14px}
#resume{background:linear-gradient(135deg,#ff4f8b,#ff8a5c)}
#quit{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
</style></head><body>
<canvas id="cv"></canvas>
<div id="bar"><button id="menuBtn" type="button">⚙ 設定</button><button id="stop" disabled>⏸ 一時停止</button></div>
<div id="pause" class="hide"><div class="pbox"><div class="ptitle">⏸ 一時停止中</div><button id="resume" type="button">▶ 再開（3秒後に始まります）</button><button id="quit" type="button">■ やめる</button></div></div>
<div id="menu">
<div class="wrapm">
<div class="hero"><div class="logo">♪ RHYTHM</div><div class="sub">タップとホールドの音ゲー</div></div>
<div class="actions">
<button id="go" type="button" class="big go"><span class="ic">▶</span><span id="goTxt">スタート</span></button>
<button id="cal" type="button" class="big cal"><span class="ic">🎯</span><span>タイミング調整<small>音に合わせて16回タップ</small></span></button>
</div>
<div class="mini"><button id="fs" type="button">⛶ 全画面</button><button id="closeMenu" type="button">✕ 閉じる</button></div>
<div id="st"></div>
<section class="card"><h3>🎮 ゲーム</h3>
<div class="row"><span>難易度</span><select id="diff" class="seg"><option value="0">ノーマル</option><option value="1">ハード</option></select></div>
<div class="row"><span>レーン数</span><select id="lanes" class="seg"><option value="4">4レーン</option><option value="5">5レーン</option></select></div>
<div class="row"><span>BPM</span><input id="bpm" type="number" min="60" max="300" step="1"></div>
<label class="sl"><div class="top"><span>ノーツ速度</span><b id="vspeed"></b></div><input id="speed" type="range" min="1" max="30" step="0.5"></label>
<div class="row"><span>5レーン時のキー（PC）</span><select id="key" class="seg"><option value="0">SDFJK</option><option value="1">DFJKL</option></select></div>
</section>
<section class="card"><h3>🎨 見た目</h3>
<div class="row"><span>ノーツのスキン</span><select id="skin" class="seg"><option value="0">ノーマル</option><option value="1">シンプル</option><option value="2">高品質</option></select></div>
<div class="row"><span>ノーツの落ち方</span><select id="view" class="seg"><option value="0">斜め</option><option value="1">垂直</option></select></div>
<label class="sl"><div class="top"><span>レーン幅（0で自動）</span><b id="vlnw"></b></div><input id="lnw" type="range" min="0" max="400" step="1"></label>
<label class="sl"><div class="top"><span>ノーツ開始位置（上から%）</span><b id="vspawn"></b></div><input id="spawn" type="range" min="0" max="80" step="1"></label>
<div class="hint">スライダーを動かしている間は、後ろにゲーム画面が透けて見えます。黄色い線から下に、ノーツが現れます。</div>
</section>
<section class="card"><h3>🔊 音</h3>
<div class="row"><span>タップ音</span><label class="sw"><input id="tap" type="checkbox"><i></i></label></div>
<div class="row"><span>タップ音の種類</span><select id="tapsnd" class="seg"><option value="0">ピッ</option><option value="1">ポン</option><option value="2">スナップ</option></select></div>
<div class="row"><span>メトロノーム</span><label class="sw"><input id="metro" type="checkbox"><i></i></label></div>
</section>
<section class="card"><h3>⏱ タイミング</h3>
<label class="sl"><div class="top"><span>タイミング調整 (ms)</span><b id="voff"></b></div><input id="off" type="range" min="-200" max="200" step="1"></label>
<div class="hint">＋で判定が遅くなります。上の「タイミング調整」ボタンで、自動で設定もできます。</div>
</section>
<details><summary>🛠 難易度の詳細設定（選択中の難易度を編集）</summary>
<div class="dgrid">
<label>ノーツ間隔 <select id="d_sub"><option value="8">8分</option><option value="16">16分</option><option value="24">24分</option><option value="0">混合（小節ごとにランダム）</option></select></label>
<label>ノーツ密度 (%)（グリッドを埋める割合）<input id="d_pr" type="number" min="1" max="100" step="1"></label>
<label>ホールド率 (%)<input id="d_hold" type="number" min="0" max="100" step="1"></label>
<label>ホールド長 最短 (拍)<input id="d_hmin" type="number" min=".25" max="8" step=".25"></label>
<label>ホールド長 最長 (拍)<input id="d_hmax" type="number" min=".25" max="8" step=".25"></label>
<label>同時押し率 (%)<input id="d_chord" type="number" min="0" max="100" step="1"></label>
<label>ホールド内ノーツ率 (%)<input id="d_pin" type="number" min="0" max="100" step="1"></label>
<div style="display:flex;align-items:end"><button id="d_reset" type="button">初期値に戻す</button></div>
</div></details>
<div id="dbg"></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let H=620,JY=470,W0=800,X0=0,LWe=130,NZ=22,HZ=30,SC=1;const LEAD=2000,NH=20;
let BEAT=400,nb=0,gb=0,gcur=0,gbar=-1,gsub=16,pend=[],cal=false,calOff=0,calD=[],calGen=0,nbuf=null,fc=0,lc=0,calMsg="",paused=false,pauseAt=0,pauseAC=0,frozen=0,cdEnd=0,cdNum=0,spawnFlash=-9999;
// 難易度の初期値（画面の「難易度の詳細設定」で編集可）sub=ノーツ間隔(8/16/24/0=混合) pr=1マスの出現率 hold=ホールド率 hmin/hmax=ホールド長(拍) chord=同時押し率
const DD=[{sub:16,pr:.6,hold:.18,hmin:1,hmax:2,chord:.18,pin:.12},{sub:0,pr:.85,hold:.25,hmin:.5,hmax:2,chord:.4,pin:.25}];
const DIFF=JSON.parse(JSON.stringify(DD));
try{JSON.parse(localStorage.getItem("g20d2")||"[]").forEach((d,i)=>{if(DIFF[i]&&d)Object.assign(DIFF[i],d)})}catch(e){}
const SK=["speed","off","spawn","lnw","lanes","diff","bpm","key","skin","tapsnd","view"];
const S={speed:10,off:0,spawn:0,lnw:130,lanes:4,diff:0,bpm:150,tap:1,key:0,metro:1,skin:0,tapsnd:0,view:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("g20")||"{}"))}catch(e){}
if(!S.v2){S.v2=1;if(S.lnw<=110)S.lnw=130}
if(!S.v3){S.v3=1;S.lnw=0}
const cv=$("cv"),ctx=cv.getContext("2d");
let actx,t0=0,run=false,N=[],cnt=[0,0,0,0,0],combo=0,maxc=0,score=0,lastJ=null,rnd,last=[],lh=[];
function fit(){const vv=window.visualViewport;W0=Math.round(vv&&vv.width?vv.width:window.innerWidth);H=Math.round(vv&&vv.height?vv.height:window.innerHeight);
  JY=H-Math.round(H*.24);NZ=JY*.047;HZ=H*.05;SC=Math.max(.8,Math.min(1.6,H/620,W0/760));
  LWe=S.lnw?Math.max(20,Math.min(S.lnw,Math.floor(W0/S.lanes))):Math.max(20,Math.floor(Math.min(W0*.6,H*.95)/S.lanes));X0=Math.round((W0-S.lanes*LWe)/2);
  const dpr=window.devicePixelRatio||1;cv.width=W0*dpr;cv.height=H*dpr;cv.style.width=W0+"px";cv.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
function apply(){
  for(const k of SK){S[k]=+$(k).value;const v=$("v"+k);if(v)v.textContent=S[k]}
  $("vlnw").textContent=S.lnw||"自動";
  S.tap=$("tap").checked?1:0;S.metro=$("metro").checked?1:0;kh.fill(0);
  fit();
  try{localStorage.setItem("g20",JSON.stringify(S))}catch(e){}
  if(!run)draw(-1000);
}
for(const k of SK){$(k).value=S[k];$(k).addEventListener("input",apply)}
$("tap").checked=!!S.tap;$("tap").addEventListener("change",apply);
$("metro").checked=!!S.metro;$("metro").addEventListener("change",apply);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---- 無限生成：ユメステ高難易度譜面に多い配置をグループ化し、ランダムに選んで連結 ----
function mkPat(D,sm){
  const K=S.lanes,r=rnd,ri=n=>Math.floor(r()*n),T=l=>({l,d:0}),seq=a=>a.map(l=>[T(l)]);
  const hlen=()=>Math.max(2,Math.round((D.hmin+r()*(Math.max(D.hmin,D.hmax)-D.hmin))*gsub/4));
  const fresh=(p,c)=>{const o=[];while(o.length<c){const l=ri(K);if(!p.includes(l)&&!o.includes(l))o.push(l)}return o};
  const P={
    stair(){const n=3+ri(K-2),s=ri(K-n+1);return seq(Array.from({length:n},(_,i)=>s+i))},
    fold(){const a=[...Array(K).keys()];return seq(a.concat(a.slice(1,-1).reverse()))},
    trill(){const a=ri(K-1),b=a+1+(a+2<K&&r()<.4?1:0),n=4+2*ri(3);return seq(Array.from({length:n},(_,i)=>i%2?b:a))},
    far(){const a=ri(K-1),f=a<K/2?K-1:0,n=6+ri(3);return seq(Array.from({length:n},(_,i)=>i%3==2?f:i%2?a+1:a))},
    jack(){const l=ri(K),sd=Math.max(1,Math.ceil(90/sm)),o=[[T(l)]];for(let j=1;j<sd;j++)o.push([]);o.push([T(l)]);return o},
    zig(){const o=K>4?ri(2):0,z=[0,2,1,3].map(x=>x+o);return seq(z.concat(z.slice().reverse().slice(1)))},
    scat(){let p=[-1];return Array.from({length:4+ri(5)},()=>{p=fresh(p,1);return[T(p[0])]})},
    acc(){let p=[];return Array.from({length:8},(_,i)=>{p=fresh(p,i%4?1:2);return p.map(T)})},
    edge(){const n=4+2*ri(3);return Array.from({length:n},(_,i)=>[T(i%2?K-1:0)])},
    chord(){let p=[];return Array.from({length:1+ri(3)},()=>{p=fresh(p,2);return p.map(T)})},
    cx(){const o=ri(K-3),A=[o,o+2],B=[o+1,o+3],n=4+2*ri(2);return Array.from({length:n},(_,i)=>(i%2?B:A).map(T))},
    tri(){const e=ri(K);return[[...Array(K).keys()].filter(x=>x!=e).slice(0,3).map(T)]},
    schord(){const n=2+ri(K-3),s=ri(K-1-n);return Array.from({length:n},(_,i)=>[T(s+i),T(s+i+2)])},
    hold(){const hl=hlen(),hn=r()<.5?0:K-1,ot=[...Array(K).keys()].filter(x=>x!=hn),md=ri(2),s2=Math.max(1,Math.ceil(80/sm)),o=[];
      for(let i=0;i<hl;i++){const it=[];if(i==0)it.push({l:hn,d:hl*sm});if(i%s2==0){const q=i/s2;it.push(T(ot[md?q%2:q%ot.length]))}o.push(it)}return o},
    hpair(){const hl=hlen(),n=1+ri(2),o=[];for(let k=0;k<n;k++){const a=n==1?ri(K-1):k?K-2:0,b=n==1&&a+2<K&&r()<.4?a+2:a+1;for(let i=0;i<hl;i++)o.push(i?[]:[{l:a,d:hl*sm},{l:b,d:hl*sm}])}return o},
    hstair(){const hl=hlen(),n=3+ri(K-2),hs=1+ri(2),ord=r()<.5?[...Array(K).keys()]:[1,3,0,2,4].filter(x=>x<K),o=Array.from({length:(n-1)*hs+hl},()=>[]);
      for(let i=0;i<n;i++)o[i*hs].push({l:ord[i],d:hl*sm});return o}
  };
  const W=[[P.stair,3],[P.fold,1.5],[P.trill,2.5],[P.far,1.5],[P.zig,2],[P.scat,2],[P.acc,2],[P.edge,1],[P.jack,.15],[P.chord,D.chord*10],[P.cx,D.chord*5],[P.tri,D.chord*3],[P.schord,1],[P.hold,D.hold*10],[P.hpair,D.hold*5],[P.hstair,D.hold*5]];
  let x=r()*W.reduce((a,w)=>a+w[1],0),f=W[0][0];for(const w of W){if((x-=w[1])<0){f=w[0];break}}
  const fl=r()<.5,res=f().map(s=>s.map(it=>({l:fl?K-1-it.l:it.l,d:it.d}))),mn=Math.ceil(250/sm);
  if(D.pin>0){const ad=[];res.forEach((its,i)=>its.forEach(it=>{if(it.d>0){const hl=Math.round(it.d/sm),lo=i+mn,hi=Math.min(res.length-1,i+hl-1);if(hi>=lo&&r()<D.pin)ad.push([lo+ri(hi-lo+1),it.l])}}));for(const[j,l]of ad)res[j].push({l,d:0,in:1})}
  res.jk=f===P.jack;return res;
}
function fill(now){
  if(cal){if(!calGen){calGen=1;for(let i=0;i<16;i++)N.push({t:LEAD+i*BEAT,l:i%S.lanes,k:0,d:0,st:0})}return}
  const D=DIFF[S.diff]||DIFF[0],r=rnd,ahead=Math.max(3000,JY/(S.speed*.06)+900);
  while(gcur<now+ahead){
    const bar=Math.max(0,Math.floor((gcur-LEAD)/(4*BEAT)+1e-6)),bt=LEAD+bar*4*BEAT;
    if(bar!=gbar){gbar=bar;gsub=D.sub||[8,16,24][Math.floor(r()*3)]}
    const sm=4*BEAT/gsub;
    gcur=bt+Math.ceil((gcur-bt)/sm-1e-6)*sm;
    if(gcur>=bt+4*BEAT-1e-6)continue;
    let st;for(let k=0;k<8;k++){st=mkPat(D,sm);const f=st.find(a=>a.length);if(st.jk||!f||!f.some(it=>pend.includes(it.l)))break}
    st.forEach((its,i)=>its.forEach(it=>{const t=gcur+i*sm;if(!it.in&&t-last[it.l]<(lh[it.l]?250:80))return;if(!it.in){last[it.l]=t+it.d;lh[it.l]=it.d?1:0}N.push({t,l:it.l,k:it.d?1:0,d:it.d,st:0})}));
    const ls=[...st].reverse().find(a=>a.length);pend=ls?ls.map(it=>it.l):[];
    gcur+=st.length*sm+Math.round(st.length*(1/Math.max(.05,D.pr)-1)*(.5+r()))*sm;
  }
}

// ---- audio ----
function blip(time,f,dur,vol,type){const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(vol,time);g.gain.exponentialRampToValueAtTime(.001,time+dur);o.connect(g).connect(actx.destination);o.start(time);o.stop(time+dur+.02)}
// 画面の時刻は「実際に聞こえている音」の時刻に合わせる（出力遅延の補正）
let p0=0,adj=0;
const audioMs=()=>(actx.currentTime-(actx.outputLatency||actx.baseLatency||0)-t0)*1000;
const cur=()=>performance.now()-p0+adj;
let lastAC=-1,lastACp=0;
const sync=()=>{const c=actx.currentTime,pn=performance.now();if(c!==lastAC){lastAC=c;lastACp=pn}if(pn-lastACp>400||actx.state!="running")return;adj+=(audioMs()-(pn-p0)-adj)*.03};

document.addEventListener("visibilitychange",()=>{if(document.hidden)pauseGame()});

// ---- 難易度の詳細設定 ----
const DF=["sub","pr","hold","hmin","hmax","chord","pin"],PCT={pr:1,hold:1,chord:1,pin:1};
function loadD(){const D=DIFF[S.diff]||DIFF[0];for(const k of DF)$("d_"+k).value=PCT[k]?Math.round(D[k]*100):D[k]}
function saveD(){const D=DIFF[S.diff]||DIFF[0];for(const k of DF){let v=+$("d_"+k).value;if(!isFinite(v))continue;if(k=="hmin"||k=="hmax")v=Math.max(.25,v);D[k]=PCT[k]?Math.max(0,Math.min(1,v/100)):v}
  try{localStorage.setItem("g20d2",JSON.stringify(DIFF))}catch(e){}}
for(const k of DF)$("d_"+k).addEventListener("input",saveD);
$("diff").addEventListener("input",loadD);
$("d_reset").onclick=()=>{DIFF[S.diff]=JSON.parse(JSON.stringify(DD[S.diff]));loadD();saveD()};
$("spawn").addEventListener("input",()=>{spawnFlash=performance.now();setTimeout(()=>{if(!run)draw(-1000)},2600)});
if(document.querySelectorAll){
  document.querySelectorAll("select.seg").forEach(sel=>{const g=document.createElement("div");g.className="seg";
    const sync=()=>Array.from(g.children).forEach(b=>b.classList.toggle("on",b.dataset.v==sel.value));
    Array.from(sel.options).forEach(o=>{const b=document.createElement("button");b.type="button";b.textContent=o.text;b.dataset.v=o.value;b.onclick=()=>{sel.value=o.value;sel.dispatchEvent(new Event("input"));sync()};g.appendChild(b)});
    sel.style.display="none";sel.after(g);sync();sel.addEventListener("input",sync)});
  document.querySelectorAll("input[type=range]").forEach(r=>{const card=r.closest(".card"),on=()=>{menuEl.classList.add("peek");card.classList.add("keep")},off=()=>setTimeout(()=>{menuEl.classList.remove("peek");card.classList.remove("keep")},400);
    r.addEventListener("pointerdown",on);r.addEventListener("touchstart",on,{passive:true});for(const e of["pointerup","pointercancel","touchend","touchcancel","change"])r.addEventListener(e,off)})}
apply();loadD();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
