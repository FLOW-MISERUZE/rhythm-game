<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b0c2e">
<meta name="apple-mobile-web-app-title" content="音ゲー">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音ゲー</title>
<style>
:root{--bg:#f4f4f6;--fg:#1a1a22;--card:#fff;--bd:#cfcfda;--ac:#2f6df0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101016;--fg:#e8e8f0;--card:#1b1b24;--bd:#363646;--ac:#6c9bff}}
:root[data-theme="dark"]{--bg:#101016;--fg:#e8e8f0;--card:#1b1b24;--bd:#363646;--ac:#6c9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding:12px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;max-width:760px;margin:0 auto 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}
label{display:flex;flex-direction:column;gap:2px;font-size:12px}
label.row{flex-direction:row;align-items:center;gap:6px;font-size:14px}
input[type=range]{width:100%}select,input[type=number]{padding:2px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 20px;font-size:15px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}#stop{background:#d9455f;margin-left:8px}
.wrap{overflow-x:auto;max-width:100%;text-align:center}
canvas{background:#0b0b12;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;display:inline-block;border-radius:6px}
#st{text-align:center;margin:8px auto;font-variant-numeric:tabular-nums}
small{opacity:.7}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}input,select{user-select:text;-webkit-user-select:text}.wrap{touch-action:none}
</style></head><body>
<div class="panel">
<div class="grid">
<label>BPM (60〜300)<input id="bpm" type="number" min="60" max="300" step="1"></label>
<label>難易度 <select id="diff"><option value="0">ノーマル</option><option value="1">ハード</option></select></label>
<label>レーン数 <select id="lanes"><option value="4">4レーン</option><option value="5">5レーン</option></select></label>
<label>5レーン時のキー <select id="key"><option value="0">S D F J K</option><option value="1">D F J K L</option></select></label>
<label>ノーツ速度 <b id="vspeed"></b><input id="speed" type="range" min="1" max="30" step="0.5"></label>
<label>タイミング調整 (ms) <b id="voff"></b><input id="off" type="range" min="-200" max="200" step="1"></label>
<label>ノーツ開始位置 (上から%) <b id="vspawn"></b><input id="spawn" type="range" min="0" max="80" step="1"></label>
<label>レーン幅 (px) <b id="vlnw"></b><input id="lnw" type="range" min="40" max="260" step="1"></label>
<label class="row"><input id="tap" type="checkbox">タップ音</label>
<label>タップ音の種類 <select id="tapsnd"><option value="0">ピッ（標準）</option><option value="1">ポン</option><option value="2">スナップ</option></select></label>
<label>ノーツの落ち方 <select id="view"><option value="0">斜め（遠近法）</option><option value="1">垂直</option></select></label>
<label class="row"><input id="metro" type="checkbox">メトロノーム</label>
<label>ノーツのスキン <select id="skin"><option value="0">ノーマル</option><option value="1">シンプル</option><option value="2">高品質</option></select></label>
<div style="display:flex;align-items:end"><button id="go">スタート</button><button id="stop" disabled>停止</button><button id="cal" type="button" style="background:#7a5cff;margin-left:8px">タイミング調整モード</button></div>
</div>
<small>キーボードでも遊べます（4レーンはD F J K、5レーンは下で選択）。停止を押すまでノーツは降り続けます。「タイミング調整モード」は、音に合わせて16回タップすると調整値を自動で設定します。タイミング調整は＋で判定が遅くなります（ノーツが音より早いと感じたら＋、遅いと感じたら−）。</small>
<details style="margin-top:8px"><summary>難易度の詳細設定（選択中の難易度を編集）</summary>
<div class="grid" style="margin-top:8px">
<label>ノーツ間隔 <select id="d_sub"><option value="8">8分</option><option value="16">16分</option><option value="24">24分</option><option value="0">混合（小節ごとにランダム）</option></select></label>
<label>ノーツ密度 (%)（グリッドを埋める割合）<input id="d_pr" type="number" min="1" max="100" step="1"></label>
<label>ホールド率 (%)<input id="d_hold" type="number" min="0" max="100" step="1"></label>
<label>ホールド長 最短 (拍)<input id="d_hmin" type="number" min=".25" max="8" step=".25"></label>
<label>ホールド長 最長 (拍)<input id="d_hmax" type="number" min=".25" max="8" step=".25"></label>
<label>同時押し率 (%)<input id="d_chord" type="number" min="0" max="100" step="1"></label>
<label>ホールド内ノーツ率 (%)<input id="d_pin" type="number" min="0" max="100" step="1"></label>
<div style="display:flex;align-items:end"><button id="d_reset" type="button">初期値に戻す</button></div>
</div></details>
</div>
<div class="wrap"><canvas id="cv"></canvas></div>
<div id="st">—</div>
<div id="dbg" style="text-align:center;font-size:12px;opacity:.7;white-space:pre-line"></div>
<script>
const $=id=>document.getElementById(id);
const H=620,JY=H-150,LEAD=2000,NH=20;
let BEAT=400,nb=0,gb=0,gcur=0,gbar=-1,gsub=16,pend=[],cal=false,calOff=0,calD=[],calGen=0,nbuf=null;
// 難易度の初期値（画面の「難易度の詳細設定」で編集可）sub=ノーツ間隔(8/16/24/0=混合) pr=1マスの出現率 hold=ホールド率 hmin/hmax=ホールド長(拍) chord=同時押し率
const DD=[{sub:16,pr:.6,hold:.18,hmin:1,hmax:2,chord:.18,pin:.12},{sub:0,pr:.85,hold:.25,hmin:.5,hmax:2,chord:.4,pin:.25}];
const DIFF=JSON.parse(JSON.stringify(DD));
try{JSON.parse(localStorage.getItem("g20d2")||"[]").forEach((d,i)=>{if(DIFF[i]&&d)Object.assign(DIFF[i],d)})}catch(e){}
const SK=["speed","off","spawn","lnw","lanes","diff","bpm","key","skin","tapsnd","view"];
const S={speed:10,off:0,spawn:0,lnw:130,lanes:4,diff:0,bpm:150,tap:1,key:0,metro:1,skin:0,tapsnd:0,view:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("g20")||"{}"))}catch(e){}
if(!S.v2){S.v2=1;if(S.lnw<=110)S.lnw=130}
const cv=$("cv"),ctx=cv.getContext("2d");
let actx,t0=0,run=false,N=[],cnt=[0,0,0,0,0],combo=0,maxc=0,score=0,lastJ=null,rnd,last=[],lh=[];
function apply(){
  for(const k of SK){S[k]=+$(k).value;const v=$("v"+k);if(v)v.textContent=S[k]}
  S.tap=$("tap").checked?1:0;S.metro=$("metro").checked?1:0;kh.fill(0);
  const dpr=window.devicePixelRatio||1,W=S.lanes*S.lnw;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  try{localStorage.setItem("g20",JSON.stringify(S))}catch(e){}
  if(!run)draw(-1000);
}
for(const k of SK){$(k).value=S[k];$(k).addEventListener("input",apply)}
$("tap").checked=!!S.tap;$("tap").addEventListener("change",apply);
$("metro").checked=!!S.metro;$("metro").addEventListener("change",apply);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---- 無限生成：ユメステ高難易度譜面に多い配置をグループ化し、ランダムに選んで連結 ----
function mkPat(D,sm){
  const K=S.lanes,r=rnd,ri=n=>Math.floor(r()*n),T=l=>({l,d:0}),seq=a=>a.map(l=>[T(l)]);
  const hlen=()=>Math.max(2,Math.round((D.hmin+r()*(Math.max(D.hmin,D.hmax)-D.hmin))*gsub/4));
  const fresh=(p,c)=>{const o=[];while(o.length<c){const l=ri(K);if(!p.includes(l)&&!o.includes(l))o.push(l)}return o};
  const P={
    stair(){const n=3+ri(K-2),s=ri(K-n+1);return seq(Array.from({length:n},(_,i)=>s+i))},
    fold(){const a=[...Array(K).keys()];return seq(a.concat(a.slice(1,-1).reverse()))},
    trill(){const a=ri(K-1),b=a+1+(a+2<K&&r()<.4?1:0),n=4+2*ri(3);return seq(Array.from({length:n},(_,i)=>i%2?b:a))},
    far(){const a=ri(K-1),f=a<K/2?K-1:0,n=6+ri(3);return seq(Array.from({length:n},(_,i)=>i%3==2?f:i%2?a+1:a))},
    jack(){const l=ri(K),sd=Math.max(1,Math.ceil(90/sm)),o=[[T(l)]];for(let j=1;j<sd;j++)o.push([]);o.push([T(l)]);return o},
    zig(){const o=K>4?ri(2):0,z=[0,2,1,3].map(x=>x+o);return seq(z.concat(z.slice().reverse().slice(1)))},
    scat(){let p=[-1];return Array.from({length:4+ri(5)},()=>{p=fresh(p,1);return[T(p[0])]})},
    acc(){let p=[];return Array.from({length:8},(_,i)=>{p=fresh(p,i%4?1:2);return p.map(T)})},
    edge(){const n=4+2*ri(3);return Array.from({length:n},(_,i)=>[T(i%2?K-1:0)])},
    chord(){let p=[];return Array.from({length:1+ri(3)},()=>{p=fresh(p,2);return p.map(T)})},
    cx(){const o=ri(K-3),A=[o,o+2],B=[o+1,o+3],n=4+2*ri(2);return Array.from({length:n},(_,i)=>(i%2?B:A).map(T))},
    tri(){const e=ri(K);return[[...Array(K).keys()].filter(x=>x!=e).slice(0,3).map(T)]},
    schord(){const n=2+ri(K-3),s=ri(K-1-n);return Array.from({length:n},(_,i)=>[T(s+i),T(s+i+2)])},
    hold(){const hl=hlen(),hn=r()<.5?0:K-1,ot=[...Array(K).keys()].filter(x=>x!=hn),md=ri(2),s2=Math.max(1,Math.ceil(80/sm)),o=[];
      for(let i=0;i<hl;i++){const it=[];if(i==0)it.push({l:hn,d:hl*sm});if(i%s2==0){const q=i/s2;it.push(T(ot[md?q%2:q%ot.length]))}o.push(it)}return o},
    hpair(){const hl=hlen(),n=1+ri(2),o=[];for(let k=0;k<n;k++){const a=n==1?ri(K-1):k?K-2:0,b=n==1&&a+2<K&&r()<.4?a+2:a+1;for(let i=0;i<hl;i++)o.push(i?[]:[{l:a,d:hl*sm},{l:b,d:hl*sm}])}return o},
    hstair(){const hl=hlen(),n=3+ri(K-2),hs=1+ri(2),ord=r()<.5?[...Array(K).keys()]:[1,3,0,2,4].filter(x=>x<K),o=Array.from({length:(n-1)*hs+hl},()=>[]);
      for(let i=0;i<n;i++)o[i*hs].push({l:ord[i],d:hl*sm});return o}
  };
  const W=[[P.stair,3],[P.fold,1.5],[P.trill,2.5],[P.far,1.5],[P.zig,2],[P.scat,2],[P.acc,2],[P.edge,1],[P.jack,.15],[P.chord,D.chord*10],[P.cx,D.chord*5],[P.tri,D.chord*3],[P.schord,1],[P.hold,D.hold*10],[P.hpair,D.hold*5],[P.hstair,D.hold*5]];
  let x=r()*W.reduce((a,w)=>a+w[1],0),f=W[0][0];for(const w of W){if((x-=w[1])<0){f=w[0];break}}
  const fl=r()<.5,res=f().map(s=>s.map(it=>({l:fl?K-1-it.l:it.l,d:it.d}))),mn=Math.ceil(250/sm);
  if(D.pin>0){const ad=[];res.forEach((its,i)=>its.forEach(it=>{if(it.d>0){const hl=Math.round(it.d/sm),lo=i+mn,hi=Math.min(res.length-1,i+hl-1);if(hi>=lo&&r()<D.pin)ad.push([lo+ri(hi-lo+1),it.l])}}));for(const[j,l]of ad)res[j].push({l,d:0,in:1})}
  res.jk=f===P.jack;return res;
}
function fill(now){
  if(cal){if(!calGen){calGen=1;for(let i=0;i<16;i++)N.push({t:LEAD+i*BEAT,l:i%S.lanes,k:0,d:0,st:0})}return}
  const D=DIFF[S.diff]||DIFF[0],r=rnd,ahead=Math.max(3000,JY/(S.speed*.06)+900);
  while(gcur<now+ahead){
    const bar=Math.max(0,Math.floor((gcur-LEAD)/(4*BEAT)+1e-6)),bt=LEAD+bar*4*BEAT;
    if(bar!=gbar){gbar=bar;gsub=D.sub||[8,16,24][Math.floor(r()*3)]}
    const sm=4*BEAT/gsub;
    gcur=bt+Math.ceil((gcur-bt)/sm-1e-6)*sm;
    if(gcur>=bt+4*BEAT-1e-6)continue;
    let st;for(let k=0;k<8;k++){st=mkPat(D,sm);const f=st.find(a=>a.length);if(st.jk||!f||!f.some(it=>pend.includes(it.l)))break}
    st.forEach((its,i)=>its.forEach(it=>{const t=gcur+i*sm;if(!it.in&&t-last[it.l]<(lh[it.l]?250:80))return;if(!it.in){last[it.l]=t+it.d;lh[it.l]=it.d?1:0}N.push({t,l:it.l,k:it.d?1:0,d:it.d,st:0})}));
    const ls=[...st].reverse().find(a=>a.length);pend=ls?ls.map(it=>it.l):[];
    gcur+=st.length*sm+Math.round(st.length*(1/Math.max(.05,D.pr)-1)*(.5+r()))*sm;
  }
}

// ---- audio ----
function blip(time,f,dur,vol,type){const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(vol,time);g.gain.exponentialRampToValueAtTime(.001,time+dur);o.connect(g).connect(actx.destination);o.start(time);o.stop(time+dur+.02)}
// 画面の時刻は「実際に聞こえている音」の時刻に合わせる（出力遅延の補正）
let p0=0,adj=0;
const audioMs=()=>(actx.currentTime-(actx.outputLatency||actx.baseLatency||0)-t0)*1000;
const cur=()=>performance.now()-p0+adj;
let lastAC=-1,lastACp=0;
const sync=()=>{const c=actx.currentTime,pn=performance.now();if(c!==lastAC){lastAC=c;lastACp=pn}if(pn-lastACp>400||actx.state!="running")return;adj+=(audioMs()-(pn-p0)-adj)*.03};
const env=(g,t,v,d)=>{g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+d)};
function ping(t,f,v,d){const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;env(g,t,v,d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02)}
function hit(t,v,d,type,f){if(!nbuf)return;const sr=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();sr.buffer=nbuf;fl.type=type;fl.frequency.value=f;env(g,t,v,d);sr.connect(fl);fl.connect(g);g.connect(actx.destination);sr.start(t);sr.stop(t+d+.02)}
function metro(now){
  if(!S.metro&&!cal){nb=Math.max(nb,Math.floor((now-LEAD)/BEAT)+1);return}
  try{for(;LEAD+nb*BEAT<now+1200;nb++){const t=t0+(LEAD+nb*BEAT)/1000;if(t<actx.currentTime)continue;const a=nb%4;
    ping(t,a?480:640,a?.35:.5,.07)}}catch(e){}
}

function tapSnd(){try{const t=actx.currentTime,k=S.tapsnd|0;
  if(k==1){ping(t,1046,.3,.08);hit(t,.1,.02,"highpass",3500)}
  else if(k==2){hit(t,.5,.07,"bandpass",2600);ping(t,1800,.1,.04)}
  else blip(t,2600,.05,.15,"square")}catch(e){}}

// ---- input ----
const ptr=new Map(),fl=[0,0,0,0,0],kh=[0,0,0,0,0],held=l=>kh[l]||[...ptr.values()].includes(l);
const keymap=()=>S.lanes==4?["KeyD","KeyF","KeyJ","KeyK"]:S.key?["KeyD","KeyF","KeyJ","KeyK","KeyL"]:["KeyS","KeyD","KeyF","KeyJ","KeyK"];
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,select"))return;const l=keymap().indexOf(e.code);if(l<0||e.repeat)return;e.preventDefault();if(!kh[l]){kh[l]=1;fl[l]=performance.now();press(l,e.timeStamp)}});
addEventListener("keyup",e=>{const l=keymap().indexOf(e.code);if(l>=0)kh[l]=0});
const noSel=e=>e.preventDefault();for(const ev of ["selectstart","dragstart","contextmenu"])cv.addEventListener(ev,noSel);cv.addEventListener("touchstart",noSel,{passive:false});cv.addEventListener("touchmove",noSel,{passive:false});
// タッチはtouchイベントで処理（iPad/iOSでpointerイベントが途切れる対策）
const plog=[];const plg=(l,x)=>{plog.unshift("L"+(l+1)+":"+x);plog.length=Math.min(plog.length,6);dbg()};
let tcnt=0,tmax=0,tcan=0,tlast="-",tdl=0;const dbg=()=>{$("dbg").textContent=`入力モニター：同時タッチ ${tcnt}（最大 ${tmax}）／ キャンセル ${tcan}回 ／ 直前 ${tlast} ／ イベント時刻差 ${tdl}ms`+(plog.length?`\n直近の入力: ${plog.join(" ／ ")}`:"")};
const tsync=e=>{const ids=new Set(Array.from(e.touches).map(t=>"t"+t.identifier));for(const k of [...ptr.keys()])if(typeof k=="string"&&!ids.has(k))ptr.delete(k)};
cv.addEventListener("touchstart",e=>{e.preventDefault();tsync(e);tcnt=e.touches.length;tmax=Math.max(tmax,tcnt);tlast="start";tdl=Math.round(performance.now()-e.timeStamp);dbg();for(const t of Array.from(e.changedTouches)){const l=laneAt(t);ptr.set("t"+t.identifier,l);fl[l]=performance.now();press(l,e.timeStamp)}},{passive:false});
cv.addEventListener("touchmove",e=>{e.preventDefault();for(const t of Array.from(e.changedTouches))if(ptr.has("t"+t.identifier))ptr.set("t"+t.identifier,laneAt(t))},{passive:false});
for(const ev of ["touchend","touchcancel"])cv.addEventListener(ev,e=>{e.preventDefault();tsync(e);tcnt=e.touches.length;if(e.type=="touchcancel")tcan++;tlast=e.type.slice(5);dbg()},{passive:false});
addEventListener("blur",()=>{ptr.clear();kh.fill(0)});
const laneAt=e=>{const r=cv.getBoundingClientRect();return Math.max(0,Math.min(S.lanes-1,Math.floor((e.clientX-r.left)/S.lnw)))};
cv.addEventListener("pointerdown",e=>{if(e.pointerType=="touch")return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const l=laneAt(e);ptr.set(e.pointerId,l);fl[l]=performance.now();press(l,e.timeStamp)});
cv.addEventListener("pointermove",e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,laneAt(e))});
for(const ev of ["pointerup","pointercancel","lostpointercapture"])cv.addEventListener(ev,e=>ptr.delete(e.pointerId));
cv.addEventListener("contextmenu",e=>e.preventDefault());

// ---- judge ----
const JN=["PERFECT+","PERFECT","GREAT","GOOD","MISS"],JC=["#ffe45c","#ff9ad5","#6fe3ff","#9be37a","#8a8a99"],JS=[1,.9,.5,.25,0];
function reg(j,fl){cnt[j]++;score+=JS[j];if(j<3){combo++;maxc=Math.max(maxc,combo)}else combo=0;lastJ={j,fl,t:performance.now()}}
function press(l,ts){
  if(!run)return;const now=cur();
  if(cal){calTap(now);return}
  for(const n of N){const d=n.t+S.off-now;if(d>100)break;
    if(n.st||n.l!=l||d<-100)continue;
    const a=Math.abs(d),j=a<=25?0:a<=40?1:a<=70?2:3;n.st=1;reg(j,j?(d>0?"FAST":"LATE"):"");plg(l,JN[j]+(j?(d>0?" FAST":" LATE"):""));
    if(S.tap)tapSnd();return}
  let b=null,bd=1e9;for(const n of N){if(n.st||n.l!=l)continue;const d=n.t+S.off-now;if(Math.abs(d)<Math.abs(bd)){b=n;bd=d}}
  if(b&&Math.abs(bd)<300){plg(l,"判定の窓の外 "+(bd>0?"EARLY ":"LATE ")+Math.round(Math.abs(bd))+"ms")}else plg(l,"近くにノーツなし");
}
function update(now){if(cal)return;for(const n of N){if(n.st)continue;if(n.l>=S.lanes){n.st=3;continue}if(now>n.t+S.off+100){n.st=2;reg(4)}}}

// ---- タイミング調整モード（音に合わせて16回タップ→中央値を調整値に設定）----
function calTap(now){let b=null,bd=1e9;for(const n of N){if(n.st)continue;const d=now-n.t;if(Math.abs(d)<Math.abs(bd)){b=n;bd=d}}
  if(b&&Math.abs(bd)<300){b.st=1;calD.push(bd);lastJ={j:-1,lab:"ズレ",fl:(bd>0?"LATE ":"EARLY ")+Math.round(Math.abs(bd))+"ms",t:performance.now()};if(S.tap)tapSnd()}}
function endCal(done){
  const d=calD.slice().sort((a,b)=>a-b);cal=false;run=false;S.off=calOff;
  $("stop").disabled=true;$("go").textContent="スタート";
  if(done&&d.length>=6){const m=Math.round(d[d.length>>1]);S.off=Math.max(-200,Math.min(200,m));$("off").value=S.off;apply();
    $("st").innerHTML=`<b>調整完了</b>：${d.length}回のタップの中央値は ${m>0?"+":""}${m}ms（${m>0?"遅め":"早め"}）。タイミング調整を ${S.off}ms に設定しました（前の値：${calOff}ms）。`}
  else if(done)$("st").textContent="タップが少なすぎたため、調整値は変えていません。もう一度、音に合わせてタップしてください。";
  else $("st").textContent="調整を中止しました。";
}
// ---- draw（ユメステ風の遠近法レーン。タップ=赤、ホールド=青、レーン色は統一）----
const HZ=30,SMIN=.32,NZ=22;
function draw(now){
  const K=S.lanes,lw=S.lnw,W=K*lw,sp=S.speed*60,sy=H*S.spawn/100,cx=W/2;
  const pj=(x,z)=>{if(z<0)return[x,JY-z*.9];if(S.view==1){const u=Math.min(1,z/JY);return[x,JY-(JY-HZ)*u]}const u=Math.min(1,z/JY),q=1/(1+(1/SMIN-1)*u),f=(q-SMIN)/(1-SMIN);return[cx+(x-cx)*q,HZ+(JY-HZ)*f]};
  const poly=(pts,fill,line)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(line){ctx.strokeStyle=line;ctx.lineWidth=2;ctx.stroke()}};
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0b0c2e");g.addColorStop(1,"#2a1048");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  poly([pj(0,JY),pj(W,JY),[W,H],[0,H]],"rgba(18,22,70,.9)");
  const now2=performance.now();
  for(let l=0;l<K;l++){const a=held(l)?.32:Math.max(0,.32*(1-(now2-fl[l])/200));
    if(a>0)poly([pj(l*lw,0),pj((l+1)*lw,0),pj((l+1)*lw,JY*.55),pj(l*lw,JY*.55)],`rgba(120,200,255,${a})`)}
  ctx.strokeStyle="rgba(255,150,220,.85)";ctx.lineWidth=2;
  for(let l=0;l<=K;l++){const x=l*lw,a=pj(x,JY),b=pj(x,0);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(x,H);ctx.stroke()}
  ctx.save();ctx.beginPath();ctx.rect(0,sy,W,H-sy);ctx.clip();
  const SK2=S.skin|0,grad=(y0,y1,c0,c1)=>{const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g};
  for(const pass of [1,0])for(let i=N.length-1;i>=0;i--){const n=N[i];if(pass!=(n.k?1:0))continue;
    if(n.st==3)continue;
    const te=n.t+S.off,z=(te-now)*sp/1000,x0=n.l*lw+3,x1=(n.l+1)*lw-3,miss=n.st==2;
    const bar=(zb,kind)=>{const P=[pj(x0,zb),pj(x1,zb),pj(x1,zb+NZ),pj(x0,zb+NZ)],base=kind?"#2f8bff":"#e8264a";
      if(miss){poly(P,"#777",SK2==1?null:"#999");return}
      if(SK2==1){poly(P,base);return}
      if(SK2==2){ctx.save();ctx.shadowColor=kind?"rgba(90,180,255,.95)":"rgba(255,70,110,.95)";ctx.shadowBlur=16;ctx.lineJoin="round";
        poly(P,grad(P[3][1],P[0][1],kind?"#a8d6ff":"#ff94a8",kind?"#1b5fd8":"#b0002c"),kind?"#e8f4ff":"#ffe0e6");ctx.restore();
        const a=pj(x0+5,zb+NZ*.78),b=pj(x1-5,zb+NZ*.78);ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();return}
      poly(P,base,kind?"#bfe0ff":"#ffb3c0")};
    const body=(a,b)=>{const t=Math.min(b,JY+NZ),P=[pj(x0,a),pj(x1,a),pj(x1,t),pj(x0,t)],hd=held(n.l)&&n.st==1;
      if(miss){poly(P,"rgba(120,120,130,.5)");return}
      if(SK2==1){poly(P,hd?"rgba(47,139,255,.95)":"rgba(47,139,255,.65)");return}
      if(SK2==2){poly(P,grad(Math.min(P[2][1],P[3][1]),P[0][1],hd?"rgba(170,230,255,.9)":"rgba(110,200,255,.6)",hd?"rgba(60,130,255,.95)":"rgba(40,100,240,.7)"),"rgba(200,235,255,.9)");return}
      poly(P,hd?"rgba(130,200,255,.9)":"rgba(50,130,255,.6)")};
    if(n.k){const zt=z+n.d*sp/1000;
      if(n.st==1&&now>=te+n.d)continue;
      const z0=n.st==1?Math.max(z,0):z;if(z0>JY)continue;
      if(zt>z0)body(z0,zt);
      bar(z0,1);
    }else{
      if(n.st==1||z>JY)continue;
      bar(z,0);
    }}
  ctx.restore();
  ctx.fillStyle="#fff";ctx.fillRect(0,JY-1,W,3);
  for(let l=0;l<K;l++){const a=held(l)?.45:Math.max(.1,.45*(1-(now2-fl[l])/150));
    poly([[l*lw+2,JY+8],[(l+1)*lw-2,JY+8],[(l+1)*lw-2,JY+128],[l*lw+2,JY+128]],`rgba(255,255,255,${a})`,"rgba(255,150,220,.7)")}
  ctx.textAlign="center";
  if(run&&lastJ){const age=performance.now()-lastJ.t;
    if(age<600){ctx.globalAlpha=1-age/600;const nj=lastJ.j<0;ctx.font=nj?"bold 18px system-ui":"bold 28px system-ui";
      ctx.lineWidth=4;ctx.strokeStyle="rgba(90,30,110,.8)";ctx.strokeText(lastJ.lab||(nj?"判定外":JN[lastJ.j]),W/2,H*.5);ctx.fillStyle=nj?"#c0c0d0":JC[lastJ.j];ctx.fillText(lastJ.lab||(nj?"判定外":JN[lastJ.j]),W/2,H*.5);
      if(lastJ.fl){ctx.font="bold 16px system-ui";ctx.fillStyle=lastJ.fl[0]=="F"||lastJ.fl[0]=="E"?"#6fb7ff":"#ff8a6f";ctx.fillText(lastJ.fl,W/2,H*.5+24)}ctx.globalAlpha=1}
    if(combo>1){ctx.fillStyle="rgba(255,255,255,.9)";ctx.font="bold 40px system-ui";ctx.fillText(combo,W/2,H*.38);ctx.font="12px system-ui";ctx.fillText("COMBO",W/2,H*.38+18)}}
}
function hud(fin){
  const tot=cnt[0]+cnt[1]+cnt[2]+cnt[3]+cnt[4],acc=tot?score/tot:0;
  $("st").innerHTML=`P+ ${cnt[0]} ／ P ${cnt[1]} ／ GREAT ${cnt[2]} ／ GOOD ${cnt[3]} ／ MISS ${cnt[4]} ｜ MAX COMBO ${maxc} ｜ 達成率 ${(acc*100).toFixed(2)}% ｜ スコア ${Math.round(acc*1e6).toLocaleString()}`+(fin?"　<b>停止しました</b>":"");
}
function loop(){
  if(!run)return;sync();if(actx.state!="running")actx.resume();const now=cur();
  try{metro(now);fill(now);update(now)}catch(e){console.error(e)}
  while(N.length&&N[0].st&&N[0].t+S.off+N[0].d<now-1800)N.shift();
  draw(now);if(cal){if(now>LEAD+16*BEAT+800){endCal(true);draw(now);return}$("st").textContent=`調整モード：音とノーツに合わせてタップ（${calD.length}/16）`+(calD.length?` 平均ズレ ${Math.round(calD.reduce((a,b)=>a+b,0)/calD.length)}ms`:"")}else hud(false);requestAnimationFrame(loop);
}
function startRun(isCal){
  if(actx)actx.close();
  if(cal)S.off=calOff;cal=isCal;if(isCal){calOff=S.off;S.off=0;calD=[];calGen=0}
  actx=new(window.AudioContext||window.webkitAudioContext)();
  actx.resume&&actx.resume();try{const b=actx.createBuffer(1,1,22050),sn=actx.createBufferSource();sn.buffer=b;sn.connect(actx.destination);sn.start(0)}catch(e){}
  try{nbuf=actx.createBuffer(1,actx.sampleRate*.3,actx.sampleRate);const d=nbuf.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1}catch(e){nbuf=null}
  N=[];cnt=[0,0,0,0,0];combo=0;maxc=0;score=0;lastJ=null;
  last=Array(5).fill(-999);lh=Array(5).fill(0);BEAT=isCal?600:60000/Math.max(60,Math.min(300,S.bpm||150));nb=0;gb=0;gcur=LEAD;gbar=-1;pend=[];
  rnd=rng((Math.random()*4294967296)>>>0);
  t0=actx.currentTime+.3;p0=performance.now();adj=audioMs();run=true;
  $("go").textContent="リスタート";$("stop").disabled=false;$("go").blur();loop();
}
$("go").onclick=()=>startRun(false);$("cal").onclick=()=>startRun(true);
$("stop").onclick=()=>{if(!run)return;if(cal){endCal(false);return}run=false;$("stop").disabled=true;$("go").textContent="スタート";hud(true);draw(cur())};

// ---- 難易度の詳細設定 ----
const DF=["sub","pr","hold","hmin","hmax","chord","pin"],PCT={pr:1,hold:1,chord:1,pin:1};
function loadD(){const D=DIFF[S.diff]||DIFF[0];for(const k of DF)$("d_"+k).value=PCT[k]?Math.round(D[k]*100):D[k]}
function saveD(){const D=DIFF[S.diff]||DIFF[0];for(const k of DF){let v=+$("d_"+k).value;if(!isFinite(v))continue;if(k=="hmin"||k=="hmax")v=Math.max(.25,v);D[k]=PCT[k]?Math.max(0,Math.min(1,v/100)):v}
  try{localStorage.setItem("g20d2",JSON.stringify(DIFF))}catch(e){}}
for(const k of DF)$("d_"+k).addEventListener("input",saveD);
$("diff").addEventListener("input",loadD);
$("d_reset").onclick=()=>{DIFF[S.diff]=JSON.parse(JSON.stringify(DD[S.diff]));loadD();saveD()};
apply();loadD();$("st").textContent="スタートを押すと、停止するまでノーツが降り続けます";
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
